<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade A Beef Pools</title>

    <!-- Home screen icon (iOS) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Controls the label under the icon on the iOS home screen — without this, iOS falls
         back to the page <title>, which can get awkwardly truncated on the home screen grid. -->
    <meta name="apple-mobile-web-app-title" content="Grade A Beef Pools" />

    <!-- Makes the saved icon launch full-screen (no Safari address bar) instead of opening as
         a regular browser tab, closer to how a real app feels once it's on the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Matches the app's own dark background so the status bar area doesn't flash white. -->
    <meta name="theme-color" content="#0F1614" />

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
